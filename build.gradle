plugins {
    id 'java'
    id 'application'
    // Aggiornato: la 0.1.0 è vecchia e potrebbe avere problemi con le JDK più recenti
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'it.unicam.cs.mpgc.rpg'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25) // Perfetto, lasciato invariato
    }
}

javafx {
    // ⚠️ CAMBIATO: JavaFX deve seguire la versione della JDK.
    // La 21.0.2 non funzionerà bene (o per nulla) compilando con Java 25.
    version = "25"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.media' ]
}

application {
    mainClass = 'it.unicam.cs.mpgc.rpg.m131177.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    // MySQL e Gson vanno benissimo così
    implementation 'com.mysql:mysql-connector-j:8.3.0'
    implementation 'com.google.code.gson:gson:2.11.0'
}